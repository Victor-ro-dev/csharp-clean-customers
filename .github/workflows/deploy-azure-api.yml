name: Deploy .NET 10 API to Azure App Service (Free F1)

on:
  push:
    branches:
      - main
    paths:
      - 'MyApp.Api/**'
      - 'MyApp.Application/**'
      - 'MyApp.Core/**'
      - 'MyApp.Infrastructure/**'
      - '.github/workflows/deploy-azure-api.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: dotnet build MyApp.Api/MyApp.Api.csproj --configuration Release

      - name: Publish API
        run: dotnet publish MyApp.Api/MyApp.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
